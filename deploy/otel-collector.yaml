receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Defence in depth: drop any attribute that could carry prompt/completion content.
  attributes/drop_content:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}

exporters:
  debug:
    verbosity: basic
  # otlphttp:  # swap in your backend
  #   endpoint: https://your-otlp-backend
  #   headers: {authorization: "Bearer ${env:OTLP_TOKEN}"}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/drop_content, batch]
      exporters: [debug]
