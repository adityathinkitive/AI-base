[project]
name = "ai-base"
version = "0.1.0"
description = "Vendor-agnostic production template for healthcare AI services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

# Vendor SDKs are opt-in: install only the adapters you select in config.
[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
faster-whisper = ["faster-whisper>=1.0"]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=4.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415", "S101", "E501", "UP047", "PT018"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR"]
"libs/aibase/testing/**" = ["S"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [
    "libs",
    "services/_service_template/src",
    "services/chatbot/src",
    "services/preprocessing/src",
    "services/rag/src",
    "services/summarization/src",
    "services/transcription/src",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "libs"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "presidio_analyzer.*", "presidio_anonymizer.*", "redis.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["libs/aibase"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
